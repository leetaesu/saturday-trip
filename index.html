<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>토요일 나들이 일정표</title>
  <style>
    :root {
      --bg: #f6f4ef;
      --card: #ffffff;
      --ink: #1f2328;
      --sub: #6b7076;
      --line: #e3ded4;
      --point: #e8590c;
      --done: #2f9e44;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
      background: var(--bg);
      color: var(--ink);
      line-height: 1.5;
    }
    .wrap { max-width: 560px; margin: 0 auto; padding: 28px 18px 60px; }
    header h1 { margin: 0 0 4px; font-size: 26px; }
    header .meta { color: var(--sub); font-size: 15px; }
    header .dday {
      display: inline-block; margin-top: 10px; padding: 4px 12px;
      border-radius: 999px; background: var(--point); color: #fff;
      font-weight: 700; font-size: 14px;
    }
    h2 { font-size: 18px; margin: 32px 0 12px; }

    .timeline { list-style: none; margin: 0; padding: 0; position: relative; }
    .timeline::before {
      content: ""; position: absolute; left: 58px; top: 6px; bottom: 6px;
      width: 2px; background: var(--line);
    }
    .item { display: flex; gap: 20px; margin-bottom: 14px; position: relative; }
    .item .time { width: 44px; flex-shrink: 0; font-weight: 700; font-size: 14px; padding-top: 12px; text-align: right; }
    .item .dot {
      position: absolute; left: 53px; top: 16px; width: 12px; height: 12px;
      border-radius: 50%; background: var(--card); border: 3px solid var(--point);
    }
    .item.now .dot { background: var(--point); box-shadow: 0 0 0 4px rgba(232, 89, 12, .2); }
    .item.past { opacity: .5; }
    .item .card {
      flex: 1; background: var(--card); border: 1px solid var(--line);
      border-radius: 14px; padding: 12px 14px;
    }
    .item .title { font-weight: 700; }
    .item .emoji { margin-right: 4px; }
    .item .memo { color: var(--sub); font-size: 14px; margin-top: 2px; }
    .item .foot { display: flex; justify-content: space-between; align-items: center; margin-top: 8px; font-size: 13px; }
    .item .map { color: var(--point); text-decoration: none; font-weight: 600; }
    .item .cost { color: var(--sub); }

    .box { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; }
    .check { list-style: none; margin: 0; padding: 0; }
    .check li { padding: 6px 0; }
    .check label { display: flex; gap: 10px; align-items: center; cursor: pointer; }
    .check input { width: 18px; height: 18px; accent-color: var(--done); }
    .check input:checked + span { text-decoration: line-through; color: var(--sub); }
    .total { display: flex; justify-content: space-between; font-weight: 700; }
    .total small { display: block; font-weight: 400; color: var(--sub); }
    footer { margin-top: 40px; text-align: center; color: var(--sub); font-size: 12px; }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1 id="title"></h1>
      <div class="meta" id="meta"></div>
      <span class="dday" id="dday"></span>
    </header>

    <h2>🗓️ 일정</h2>
    <ol class="timeline" id="timeline"></ol>

    <h2>💰 예상 경비</h2>
    <div class="box">
      <div class="total" id="total"></div>
    </div>

    <h2>🎒 준비물</h2>
    <div class="box">
      <ul class="check" id="checklist"></ul>
    </div>

    <footer>준비물 체크는 이 기기에만 저장돼요.</footer>
  </div>

  <script>
    // ===== 여기만 고치면 됩니다 =====
    const TRIP = {
      title: "토요일 나들이",
      date: "2026-11-07",          // YYYY-MM-DD
      place: "서울",
      people: ["나", "친구1", "친구2"],
      schedule: [
        { time: "10:00", emoji: "🚇", title: "집합", place: "OO역 1번 출구", memo: "늦으면 커피 쏘기", cost: 0 },
        { time: "11:00", emoji: "☕", title: "브런치", place: "OO 카페", memo: "", cost: 15000 },
        { time: "13:00", emoji: "🚶", title: "산책", place: "OO 공원", memo: "단풍 사진 찍기", cost: 0 },
        { time: "15:30", emoji: "🎨", title: "전시 관람", place: "OO 미술관", memo: "온라인 예매 완료", cost: 12000 },
        { time: "18:00", emoji: "🍖", title: "저녁", place: "OO 고깃집", memo: "예약 필요", cost: 25000 },
        { time: "20:30", emoji: "🏠", title: "해산", place: "", memo: "", cost: 0 }
      ],
      checklist: ["지갑 / 교통카드", "보조배터리", "얇은 겉옷", "물티슈", "우산 (날씨 확인)"]
    };
    // ================================

    const won = n => n.toLocaleString("ko-KR") + "원";
    const days = ["일", "월", "화", "수", "목", "금", "토"];
    const tripDate = new Date(TRIP.date + "T00:00:00");

    document.title = TRIP.title + " 일정표";
    document.getElementById("title").textContent = TRIP.title;
    document.getElementById("meta").textContent =
      `${tripDate.getMonth() + 1}월 ${tripDate.getDate()}일 (${days[tripDate.getDay()]}) · ${TRIP.place} · ${TRIP.people.join(", ")}`;

    const today = new Date();
    today.setHours(0, 0, 0, 0);
    const diff = Math.round((tripDate - today) / 86400000);
    document.getElementById("dday").textContent =
      diff > 0 ? `D-${diff}` : diff === 0 ? "오늘이에요! 🎉" : "다녀왔어요";

    // 일정 (당일엔 지금 진행 중인 일정 강조)
    const now = new Date();
    const isToday = diff === 0;
    const toMin = t => { const [h, m] = t.split(":").map(Number); return h * 60 + m; };
    const nowMin = now.getHours() * 60 + now.getMinutes();
    const timeline = document.getElementById("timeline");

    TRIP.schedule.forEach((s, i) => {
      const start = toMin(s.time);
      const end = TRIP.schedule[i + 1] ? toMin(TRIP.schedule[i + 1].time) : 24 * 60;
      let state = "";
      if (isToday) state = nowMin >= end ? "past" : nowMin >= start ? "now" : "";

      const mapLink = s.place
        ? `<a class="map" href="https://map.naver.com/p/search/${encodeURIComponent(s.place)}" target="_blank" rel="noopener">📍 ${s.place}</a>`
        : "<span></span>";
      const cost = s.cost ? `<span class="cost">${won(s.cost)}</span>` : "";

      const li = document.createElement("li");
      li.className = "item " + state;
      li.innerHTML = `
        <div class="time">${s.time}</div>
        <span class="dot"></span>
        <div class="card">
          <div class="title"><span class="emoji">${s.emoji || ""}</span>${s.title}</div>
          ${s.memo ? `<div class="memo">${s.memo}</div>` : ""}
          ${mapLink || cost ? `<div class="foot">${mapLink}${cost}</div>` : ""}
        </div>`;
      timeline.appendChild(li);
    });

    // 경비
    const sum = TRIP.schedule.reduce((a, s) => a + (s.cost || 0), 0);
    document.getElementById("total").innerHTML =
      `<span>1인 기준 합계<small>${TRIP.people.length}명 전체 ${won(sum * TRIP.people.length)}</small></span><span>${won(sum)}</span>`;

    // 준비물 체크 (localStorage)
    const KEY = "trip-check-" + TRIP.date;
    const saved = JSON.parse(localStorage.getItem(KEY) || "{}");
    const checklist = document.getElementById("checklist");
    TRIP.checklist.forEach(name => {
      const li = document.createElement("li");
      li.innerHTML = `<label><input type="checkbox"${saved[name] ? " checked" : ""}><span>${name}</span></label>`;
      li.querySelector("input").addEventListener("change", e => {
        saved[name] = e.target.checked;
        localStorage.setItem(KEY, JSON.stringify(saved));
      });
      checklist.appendChild(li);
    });
  </script>
</body>
</html>
